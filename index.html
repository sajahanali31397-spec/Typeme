    * { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    ::selection { background-color: rgba(99, 102, 241, 0.35); color: #fff; }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.6); }

    /* 6 Eye-Protection Themes */
    body.theme-midnight { background-color: #0b0f19; color: #f1f5f9; }
    body.theme-midnight .theme-card { background-color: rgba(19, 27, 46, 0.85); border-color: rgba(255, 255, 255, 0.08); }
    body.theme-midnight .theme-sub { background-color: #060911; }

    body.theme-sage { background-color: #0c1813; color: #e8f5ed; }
    body.theme-sage .theme-card { background-color: rgba(18, 38, 29, 0.85); border-color: rgba(16, 185, 129, 0.15); }
    body.theme-sage .theme-sub { background-color: #07110d; }

    body.theme-sepia { background-color: #272018; color: #fceed3; }
    body.theme-sepia .theme-card { background-color: rgba(56, 45, 34, 0.9); border-color: rgba(217, 119, 6, 0.2); }
    body.theme-sepia .theme-sub { background-color: #1a150f; }

    body.theme-paper { background-color: #fbf9f4; color: #1e293b; }
    body.theme-paper .theme-card { background-color: #ffffff; border-color: #e2e8f0; }
    body.theme-paper .theme-sub { background-color: #f1ede4; }

    body.theme-mocha { background-color: #1e1717; color: #fae8e8; }
    body.theme-mocha .theme-card { background-color: rgba(46, 33, 33, 0.9); border-color: rgba(244, 63, 94, 0.15); }
    body.theme-mocha .theme-sub { background-color: #130d0d; }

    body.theme-cyberpunk { background-color: #080812; color: #e2e8ff; }
    body.theme-cyberpunk .theme-card { background-color: rgba(20, 19, 44, 0.9); border-color: rgba(129, 140, 248, 0.2); }
    body.theme-cyberpunk .theme-sub { background-color: #040409; }

    /* Spinning Ashoka Chakra Animation */
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow { animation: spin-slow 20s linear infinite; }

    /* Print / PDF Stylesheet */
    @media print {
      body { background: #ffffff !important; color: #000000 !important; }
      header, footer, nav, button, .no-print { display: none !important; }
      .print-only { display: block !important; }
      .theme-card { border: 1px solid #ccc !important; background: #fff !important; box-shadow: none !important; }
    }
    .print-only { display: none; }
  </style>

    // High Definition Synthetic Web Audio Engine with Master Volume Control
    class HDSoundEngine {
      constructor() {
        this.ctx = null;
        this.masterVolume = 0.7; // 0.0 to 1.0
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      setVolume(val) {
        this.masterVolume = Math.max(0, Math.min(1, val));
      }
      playClick(isError = false) {
        try {
          if (this.masterVolume <= 0) return;
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          
          if (isError) {
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(130, this.ctx.currentTime);
            gain.gain.setValueAtTime(0.12 * this.masterVolume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
          } else {
            osc.type = "sine";
            osc.frequency.setValueAtTime(620 + Math.random() * 80, this.ctx.currentTime);
            gain.gain.setValueAtTime(0.08 * this.masterVolume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.045);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.045);
          }
        } catch (e) {}
      }
      playPop() {
        try {
          if (this.masterVolume <= 0) return;
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.type = "sine";
          osc.frequency.setValueAtTime(300, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(850, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.15 * this.masterVolume, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.08);
        } catch (e) {}
      }
      playCoinDing() {
        try {
          if (this.masterVolume <= 0) return;
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.type = "triangle";
          osc.frequency.setValueAtTime(987.77, this.ctx.currentTime); // B5
          osc.frequency.setValueAtTime(1318.51, this.ctx.currentTime + 0.08); // E6
          gain.gain.setValueAtTime(0.15 * this.masterVolume, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.25);
        } catch (e) {}
      }
      playSuccessFanfare() {
        try {
          if (this.masterVolume <= 0) return;
          this.init();
          if (!this.ctx) return;
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.09);
            gain.gain.setValueAtTime(0.14 * this.masterVolume, this.ctx.currentTime + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.09 + 0.35);
            osc.start(this.ctx.currentTime + idx * 0.09);
            osc.stop(this.ctx.currentTime + idx * 0.09 + 0.35);
          });
        } catch (e) {}
      }
    }

                        selectedGameTab === "dashboard" ? "bg-amber-500 text-white border-amber-500" : "theme-card border-white/10 opacity-70"
                      }`}
                    >
                      🏆 Arcade Point Dashboard
                    </button>
                  </div>

                  {/* GAME 1: BALLOON LETTER POP */}
                  {selectedGameTab === "balloon" && (
                    <div className="rounded-2xl theme-card p-6 shadow-sm space-y-4">
                      <div className="flex items-center justify-between">
                        <div>
                          <h3 className="font-bold text-base">🎈 Balloon Letter Pop</h3>
                          <p className="text-xs opacity-70">Type the letter inside the rising balloons to POP them!</p>
                        </div>
                        <div className="mono font-bold text-sm">
                          Score: <span className="text-indigo-400">{balloonGame.score}</span> • Lives: {"❤️".repeat(Math.max(0, balloonGame.lives))}
                        </div>
                      </div>

                      <div className="relative h-[360px] rounded-2xl theme-sub border border-white/10 overflow-hidden">
                        {balloonGame.balloons.map(b => (
                          <div
                            key={b.id}
                            className={`absolute w-12 h-14 rounded-full ${b.color} text-white font-black text-lg flex items-center justify-center shadow-lg transition-transform duration-100`}
                            style={{ left: `${b.x}%`, top: `${b.y}%` }}
                          >
                            {b.char}
                          </div>
                        ))}

                        {!balloonGame.active && (
                          <div className="absolute inset-0 grid place-items-center bg-black/40">
                            <button
                              onClick={() => setBalloonGame({ active: true, balloons: [], score: 0, combo: 0, lives: 3 })}
                              className="px-6 py-3 rounded-xl bg-indigo-600 text-white font-bold text-xs shadow-lg hover:scale-105 transition"
                            >
                              ▶ Start Balloon Pop
                            </button>
                          </div>
                        )}
                      </div>
                    </div>
                  )}

                  {/* GAME 2: WORD RAIN (SPEED MODES) */}
                  {selectedGameTab === "wordrain" && (
                    <div className="rounded-2xl theme-card p-6 shadow-sm space-y-4">
                      <div className="flex flex-wrap items-center justify-between gap-3">
                        <div>
                          <h3 className="font-bold text-base">🌧️ Word Rain Matrix</h3>
                          <p className="text-xs opacity-70">Type the falling words before they hit the ground.</p>
                        </div>

                        {/* Speed Mode Selector */}
                        <div className="flex items-center gap-1.5 text-xs">
                          <span className="opacity-60">Speed Mode:</span>
                          {["slow", "medium", "fast", "auto"].map(spd => (
                            <button
                              key={spd}
                              onClick={() => setWordRainGame(g => ({ ...g, speedMode: spd }))}
                              className={`px-2.5 py-1 rounded-lg uppercase font-bold text-[10px] border ${
                                wordRainGame.speedMode === spd ? "bg-indigo-600 text-white border-indigo-600" : "border-white/10 theme-sub opacity-70"
                              }`}
                            >
                              {spd}
                            </button>
                          ))}
                        </div>
                      </div>

                      <div className="relative h-[360px] rounded-2xl theme-sub border border-white/10 overflow-hidden">
                        {wordRainGame.words.map(w => (
                          <div
                            key={w.id}
                            className="absolute px-3 py-1 rounded-lg bg-indigo-600 text-white font-mono text-xs font-bold shadow"
                            style={{ left: `${w.x}%`, top: `${w.y}px` }}
                          >
                            {w.text}
                          </div>
                        ))}

                        {!wordRainGame.active && (
                          <div className="absolute inset-0 grid place-items-center bg-black/40">
                            <button
                              onClick={() => setWordRainGame({ active: true, words: [], speedMode: wordRainGame.speedMode, currentSpeed: 1.2, score: 0, lives: 3, input: "" })}
                              className="px-6 py-3 rounded-xl bg-indigo-600 text-white font-bold text-xs shadow-lg hover:scale-105 transition"
                            >
                              ▶ Start Word Rain
                            </button>
                          </div>
                        )}
                      </div>

                      {wordRainGame.active && (
                        <div className="flex gap-2">
                          <input
                            type="text"
                            value={wordRainGame.input}
                            onChange={e => {
                              const val = e.target.value;
                              const matched = wordRainGame.words.find(w => w.text.toLowerCase() === val.trim().toLowerCase());
                              if (matched) {
                                soundEngine.playCoinDing();
                                setWordRainGame(prev => ({
                                  ...prev,
                                  words: prev.words.filter(w => w.id !== matched.id),
                                  score: prev.score + 15,
                                  input: ""
                                }));
                                setGameStats(prev => ({
                                  ...prev,
                                  totalWordsCleared: prev.totalWordsCleared + 1,
                                  totalPoints: prev.totalPoints + 15,
                                  wordRainHighScore: Math.max(prev.wordRainHighScore, wordRainGame.score + 15)
                                }));
                              } else {
                                setWordRainGame(prev => ({ ...prev, input: val }));
                              }
                            }}
                            placeholder="Type falling words here..."
                            className="flex-1 rounded-xl border border-white/10 px-4 py-2.5 theme-sub font-mono text-sm"
                            autoFocus
                          />
                          <button
                            onClick={() => setWordRainGame(g => ({ ...g, active: false }))}
                            className="px-4 py-2.5 rounded-xl border border-white/10 font-bold text-xs"
                          >
                            Stop
                          </button>
                        </div>
                      )}
                    </div>
                  )}

                  {/* GAME DASHBOARD */}
                  {selectedGameTab === "dashboard" && (
                    <div className="rounded-2xl theme-card p-6 shadow-sm space-y-6">
                      <h3 className="font-bold text-base">🏆 Arcade Master Point Dashboard</h3>
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                        <div className="p-4 rounded-xl bg-white/5 border border-white/10">
                          <div className="text-[10px] uppercase opacity-60">Total Arcade Points</div>
                          <div className="text-3xl font-black text-amber-400 mt-1">{gameStats.totalPoints}</div>
                        </div>
                        <div className="p-4 rounded-xl bg-white/5 border border-white/10">
                          <div className="text-[10px] uppercase opacity-60">Balloons Popped</div>
                          <div className="text-3xl font-black text-rose-400 mt-1">{gameStats.totalBalloonsPopped}</div>
                        </div>
                        <div className="p-4 rounded-xl bg-white/5 border border-white/10">
                          <div className="text-[10px] uppercase opacity-60">Words Cleared</div>
                          <div className="text-3xl font-black text-indigo-400 mt-1">{gameStats.totalWordsCleared}</div>
                        </div>
                        <div className="p-4 rounded-xl bg-white/5 border border-white/10">
                          <div className="text-[10px] uppercase opacity-60">Balloon High Score</div>
                          <div className="text-3xl font-black text-emerald-400 mt-1">{gameStats.balloonHighScore}</div>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* TAB 4: LEADERBOARD */}
              {activeTab === "leaderboard" && (
                <div className="max-w-4xl mx-auto space-y-4">
                  <div className="rounded-2xl theme-card p-5 shadow-sm flex items-center justify-between">
                    <div>
                      <h3 className="font-bold text-base">🏆 All-India Aspirants Leaderboard</h3>
                      <p className="text-xs opacity-70">Real-time ranks synced with Google Drive & Sheets API.</p>
                    </div>
                    <span className="px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400">Live Synced</span>
                  </div>

                  <div className="rounded-2xl theme-card overflow-hidden shadow-sm">
                    <div className="grid grid-cols-[60px_1fr_90px_90px_90px_130px] text-[11px] uppercase font-bold tracking-wider opacity-60 px-5 py-3 border-b border-white/10">
                      <span>Rank</span>
                      <span>Candidate</span>
                      <span>Net WPM</span>
                      <span>Accuracy</span>
                      <span>Tests</span>
                      <span>Badge</span>
                    </div>
                    <div className="divide-y divide-white/5 text-xs">
                      {leaderboardList.map((item, idx) => (
                        <div key={idx} className="grid grid-cols-[60px_1fr_90px_90px_90px_130px] items-center px-5 py-3.5">
                          <span className="mono font-bold opacity-60">#{item.rank || idx + 1}</span>
                          <span className="font-semibold">{item.name}</span>
                          <span className="font-mono font-bold text-emerald-400">{item.wpm}</span>
                          <span className="mono">{item.acc}%</span>
                          <span className="mono opacity-60">{item.tests}</span>
                          <span>
                            {item.badge ? (
                              <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-500/20 text-amber-300">
                                {item.badge}
                              </span>
                            ) : "—"}
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 5: ABOUT US */}
              {activeTab === "about" && (
                <div className="max-w-4xl mx-auto space-y-6">
                  <div className="rounded-3xl theme-card p-6 md:p-10 shadow-xl space-y-8">
                    <div className="flex flex-col sm:flex-row items-center sm:items-start gap-6 border-b border-white/10 pb-8">
                      <img src={CREATOR_IMAGE_SRC} alt="Sajahan Ali" className="w-32 h-32 md:w-36 md:h-36 rounded-2xl object-cover border-4 border-indigo-500/30 shadow-xl" />
                      <div className="space-y-2 text-center sm:text-left">
                        <div className="inline-flex px-3 py-1 rounded-full text-xs font-bold bg-indigo-500/20 text-indigo-300">
                          Founder & Lead Engineer
                        </div>
                        <h2 className="text-2xl md:text-3xl font-extrabold">Sajahan Ali</h2>
                        <p className="text-xs md:text-sm opacity-80 max-w-lg leading-relaxed">
                          Developer and educator dedicated to helping aspirants across India master touch typing and clear DEST / Skill tests for SSC CGL, CHSL, MTS, and state examinations.
                        </p>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 6: RULES & NOTES */}
              {activeTab === "rules" && (
                <div className="max-w-4xl mx-auto space-y-6">
                  <div className="rounded-2xl theme-card p-6 shadow-sm space-y-4">
                    <h3 className="font-bold text-base flex items-center gap-2">📜 Official SSC DEST & Typing Norms</h3>
                    <div className="space-y-3 text-xs leading-relaxed opacity-90">
                      <div className="p-4 rounded-xl bg-white/5 border border-white/10 space-y-1">
                        <div className="font-bold text-indigo-300">Full Mistakes (1 Word Penalty):</div>
                        <div>Omission, substitution, or addition of words not found in the original text.</div>
                      </div>
                      <div className="p-4 rounded-xl bg-white/5 border border-white/10 space-y-1">
                        <div className="font-bold text-indigo-300">Half Mistakes (0.5 Word Penalty):</div>
                        <div>Spacing errors, improper capitalization, or minor punctuation mistakes.</div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 7: SETTINGS */}
              {activeTab === "settings" && (
                <div className="max-w-3xl mx-auto space-y-6">
                  <div className="rounded-2xl theme-card p-6 shadow-sm space-y-5">
                    <h3 className="font-bold text-base">⚙️ System Preferences & Sound</h3>

                    <div className="space-y-4 text-xs">
                      {/* Master Volume Slider */}
                      <div className="p-4 rounded-xl bg-white/5 border border-white/10 space-y-2">
                        <div className="flex justify-between">
                          <span className="font-bold">Master Audio Volume (HD Synthesizer)</span>
                          <span className="font-mono text-indigo-400 font-bold">{Math.round(volumeLevel * 100)}%</span>
                        </div>
                        <input
                          type="range"
                          min="0"
                          max="1"
                          step="0.05"
                          value={volumeLevel}
                          onChange={e => setVolumeLevel(parseFloat(e.target.value))}
                          className="w-full"
                        />
                      </div>

                      {/* Theme Grid */}
                      <div className="p-4 rounded-xl bg-white/5 border border-white/10 space-y-2">
                        <div className="font-bold mb-2">Select Eye-Protection Theme:</div>
                        <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                          {[
                            { id: "midnight", label: "🌙 Midnight Slate" },
                            { id: "sage", label: "🍵 Forest Sage (Eye-Care)" },
                            { id: "sepia", label: "📜 Warm Sepia" },
                            { id: "paper", label: "☀️ Soft Paper" },
                            { id: "mocha", label: "☕ Nordic Mocha" },
                            { id: "cyberpunk", label: "🌌 Cyberpunk" }
                          ].map(t => (
                            <button
                              key={t.id}
                              onClick={() => setCurrentTheme(t.id)}
                              className={`p-2.5 rounded-xl border text-xs font-semibold ${
                                currentTheme === t.id ? "bg-indigo-600 text-white border-indigo-600 font-bold" : "border-white/10 bg-white/5"
                              }`}
                            >
                              {t.label}
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 8: ADMIN PORTAL */}
              {activeTab === "admin" && isAdminAuthenticated && (
                <div className="max-w-4xl mx-auto space-y-6">
                  <div className="rounded-2xl theme-card p-6 shadow-xl space-y-5 border border-amber-500/30">
                    <div className="flex items-center justify-between border-b border-white/10 pb-4">
                      <div>
                        <h3 className="font-bold text-lg">⚡ Typeme V2 Administration Portal</h3>
                        <p className="text-xs opacity-60">Administrator: <b>Sajahan Ali</b></p>
                      </div>
                      <button onClick={() => { setIsAdminAuthenticated(false); setActiveTab("home"); }} className="px-3 py-1 rounded bg-rose-500 text-white text-xs font-bold">
                        Exit Admin
                      </button>
                    </div>

                    {/* Controls */}
                    <div className="grid md:grid-cols-2 gap-4 text-xs">
                      <div className="p-4 rounded-xl bg-white/5 border border-white/10 flex items-center justify-between">
                        <div>
                          <div className="font-bold">Games Section Switch</div>
                          <div className="opacity-60 text-[11px]">Enable / disable arcade games.</div>
                        </div>
                        <button
                          onClick={() => setAdminState(prev => ({ ...prev, gamesEnabled: !prev.gamesEnabled }))}
                          className={`px-3 py-1 rounded font-bold ${adminState.gamesEnabled ? "bg-emerald-600 text-white" : "bg-rose-600 text-white"}`}
                        >
                          {adminState.gamesEnabled ? "ENABLED" : "DISABLED"}
                        </button>
                      </div>

                      <div className="p-4 rounded-xl bg-white/5 border border-white/10 flex items-center justify-between">
                        <div>
                          <div className="font-bold">Google AdSense Deploy Switch</div>
                          <div className="opacity-60 text-[11px]">Toggle banner ad slots.</div>
                        </div>
                        <button
                          onClick={() => setAdminState(prev => ({ ...prev, adSenseEnabled: !prev.adSenseEnabled }))}
                          className={`px-3 py-1 rounded font-bold ${adminState.adSenseEnabled ? "bg-emerald-600 text-white" : "bg-slate-700 text-white"}`}
                        >
                          {adminState.adSenseEnabled ? "ACTIVE" : "OFF"}
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* Footer */}
          <footer className="border-t border-white/10 py-6 text-xs opacity-60 no-print">
            <div className="max-w-[1440px] mx-auto px-4 md:px-6 flex flex-wrap justify-between items-center gap-3">
              <div>Typeme V2 • Developed by <b>Sajahan Ali</b> • 8000 KDPH Certified</div>
              <div className="flex items-center gap-4">
                <span>Google Drive Folder: <b className="font-mono">16GJ4G5Y...2kB0</b></span>
                <button onClick={() => setShowAuthModal(true)} className="underline">Profile</button>
                <button onClick={() => setActiveTab("rules")} className="underline">SSC Norms</button>
              </div>
            </div>
          </footer>

          {/* MODAL 1: AUTH / ONBOARDING */}
          {showAuthModal && (
            <div className="fixed inset-0 z-50 grid place-items-center bg-black/60 backdrop-blur-sm p-4 no-print">
              <div className="w-full max-w-md rounded-3xl theme-card p-6 md:p-8 shadow-2xl space-y-5 border border-white/10">
                <div className="text-center space-y-1">
                  <div className="w-12 h-12 mx-auto rounded-2xl bg-indigo-600 text-white font-black text-2xl grid place-items-center shadow-lg">⚡</div>
                  <h3 className="font-black text-xl pt-2">Welcome to Typeme V2</h3>
                  <p className="text-xs opacity-70">Track typing progress and rank on the All-India leaderboard.</p>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold">Candidate Name *</label>
                    <input
                      type="text"
                      placeholder="e.g. Aman Kumar"
                      value={authForm.name}
                      onChange={e => setAuthForm({ ...authForm, name: e.target.value })}
                      className="mt-1 w-full rounded-xl border border-white/10 px-3 py-2.5 theme-sub font-medium"
                    />
                  </div>
                  <div>
                    <label className="font-semibold">Target Examination</label>
                    <select
                      value={authForm.exam}
                      onChange={e => setAuthForm({ ...authForm, exam: e.target.value })}
                      className="mt-1 w-full rounded-xl border border-white/10 px-3 py-2.5 theme-sub"
                    >
                      <option className="bg-slate-900">SSC CGL 2026</option>
                      <option className="bg-slate-900">SSC CHSL 2026</option>
                      <option className="bg-slate-900">SSC MTS</option>
                      <option className="bg-slate-900">Stenographer</option>
                    </select>
                  </div>
                </div>

                <div className="space-y-2 pt-2">
                  <button
                    onClick={() => {
                      if (!authForm.name.trim()) return alert("Please enter candidate name");
                      setUser({ ...user, name: authForm.name.trim(), email: authForm.email.trim(), exam: authForm.exam });
                      setShowAuthModal(false);
                    }}
                    className="w-full py-3 rounded-xl bg-indigo-600 text-white font-bold text-xs shadow-lg hover:opacity-90"
                  >
                    Enter Typeme & Save Profile
                  </button>
                  <button
                    onClick={() => { setUser({ ...user, name: "Guest Aspirant", isGuest: true }); setShowAuthModal(false); }}
                    className="w-full py-2 rounded-xl border border-white/10 text-xs opacity-60"
                  >
                    Continue as Guest
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 2: HIDDEN ADMIN LOGIN */}
          {showAdminLoginModal && (
            <div className="fixed inset-0 z-50 grid place-items-center bg-black/60 backdrop-blur-sm p-4 no-print">
              <div className="w-full max-w-sm rounded-3xl theme-card p-6 shadow-2xl space-y-4 border border-white/10">
                <div className="font-bold text-base">Admin Authentication</div>
                <p className="text-xs opacity-60">Authorized personnel only (Sajahan Ali).</p>
                <input
                  type="password"
                  placeholder="Security Key..."
                  value={adminPassInput}
                  onChange={e => setAdminPassInput(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && handleAdminLogin()}
                  className="w-full rounded-xl border border-white/10 px-3 py-2.5 text-xs theme-sub font-mono"
                  autoFocus
                />
                <div className="flex gap-2">
                  <button onClick={handleAdminLogin} className="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-xs shadow">
                    Unlock Portal
                  </button>
                  <button onClick={() => { setShowAdminLoginModal(false); setAdminPassInput(""); }} className="px-4 py-2.5 rounded-xl border border-white/10 text-xs">
                    Cancel
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 3: CUSTOM PARAGRAPH BUILDER */}
          {showCustomModal && (
            <div className="fixed inset-0 z-50 grid place-items-center bg-black/60 backdrop-blur-sm p-4 no-print">
              <div className="w-full max-w-lg rounded-3xl theme-card p-6 shadow-2xl space-y-4 border border-white/10">
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-base">Add Custom Paragraph</h3>
                  <button onClick={() => setShowCustomModal(false)}>✕</button>
                </div>
                <input
                  type="text"
                  placeholder="Passage Title..."
                  value={customPassageTitle}
                  onChange={e => setCustomPassageTitle(e.target.value)}
                  className="w-full rounded-xl border border-white/10 px-3 py-2 text-xs theme-sub"
                />
                <textarea
                  rows="6"
                  placeholder="Paste or write your custom text here..."
                  value={customPassageText}
                  onChange={e => setCustomPassageText(e.target.value)}
                  className="w-full rounded-xl border border-white/10 p-3 text-xs theme-sub font-mono"
                />
                <div className="flex gap-2">
                  <button
                    onClick={() => {
                      if (!customPassageTitle.trim() || !customPassageText.trim()) return alert("Fill title and text");
                      const newP = {
                        id: Date.now().toString(),
                        title: customPassageTitle.trim(),
                        exam: "Custom",
                        language: testLanguage,
                        difficulty: "Intermediate",
                        words: customPassageText.trim().split(/\s+/).length,
                        text: customPassageText.trim()
                      };
                      setPassages(prev => [newP, ...prev]);
                      setSelectedPassageId(newP.id);
                      setShowCustomModal(false);
                      setCustomPassageTitle("");
                      setCustomPassageText("");
                      alert("Custom paragraph added!");
                    }}
                    className="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-xs shadow"
                  >
                    + Save & Practice
                  </button>
                  <button onClick={() => setShowCustomModal(false)} className="px-4 py-2.5 rounded-xl border border-white/10 text-xs">
                    Cancel
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
