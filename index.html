    // Synthetic Web Audio System for Mechanical Typing Sounds & Notifications
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playKeyClick(isError = false) {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          
          if (isError) {
            // Low buzz for mistake
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(140, this.ctx.currentTime);
            gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
          } else {
            // Crispy mechanical switch tone
            osc.type = "sine";
            osc.frequency.setValueAtTime(600 + Math.random() * 90, this.ctx.currentTime);
            gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.04);
          }
        } catch (e) {}
      }
      playSubmitSuccess() {
        try {
          this.init();
          if (!this.ctx) return;
          const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6 Fanfare
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.09);
            gain.gain.setValueAtTime(0.09, this.ctx.currentTime + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.09 + 0.3);
            osc.start(this.ctx.currentTime + idx * 0.09);
            osc.stop(this.ctx.currentTime + idx * 0.09 + 0.3);
          });
        } catch (e) {}
      }
    }

    const INITIAL_LEADERBOARD = [
      { rank: 1, name: "Priya Sharma", wpm: 68, acc: 98.4, exam: "SSC CGL", tests: 342, badge: "SSC Topper 🏆" },
      { rank: 2, name: "Rahul Verma", wpm: 65, acc: 97.8, exam: "SSC CHSL", tests: 298, badge: "50+ WPM Club" },
      { rank: 3, name: "Sajahan Ali", wpm: 62, acc: 99.1, exam: "Admin / Creator", tests: 410, badge: "Creator ⚡" },
      { rank: 4, name: "Sneha Patel", wpm: 61, acc: 96.4, exam: "SSC MTS", tests: 276, badge: "50+ WPM Club" },
      { rank: 5, name: "Vikram Singh", wpm: 59, acc: 95.1, exam: "Stenographer", tests: 210, badge: "Speed Master" },
      { rank: 6, name: "Anjali Gupta", wpm: 58, acc: 96.9, exam: "SSC CGL", tests: 189, badge: "" },

    ];

    function App() {
      // 1. Core State
      const [darkMode, setDarkMode] = useState(() => localStorage.getItem("typeme_theme") !== "light");
      const [activeTab, setActiveTab] = useState("home"); // home | tests | games | analytics | leaderboard | about | rules | settings | profile | admin
      const [soundEnabled, setSoundEnabled] = useState(true);

      // 2. User & Auth State
      const [user, setUser] = useState(() => {
        const saved = localStorage.getItem("typeme_user");
        return saved ? JSON.parse(saved) : {
          name: "",
          email: "",
          exam: "SSC CGL 2026",
          target: 45,
          examDate: "2026-06-15",
          isGuest: false,
          onboarded: false
        };
      });

      const [showAuthModal, setShowAuthModal] = useState(!user.name && !user.isGuest);
      const [authForm, setAuthForm] = useState({ name: "", email: "", exam: "SSC CGL 2026" });

      // 3. Admin & Notices State
      const [adminState, setAdminState] = useState(() => {
        const saved = localStorage.getItem("typeme_admin_cfg");
        return saved ? JSON.parse(saved) : {
          gamesEnabled: true,
          notices: [
            { id: "1", title: "🎉 Welcome to Typeme 2.0!", content: "SSC CGL & CHSL Tier-II DEST practice sets with 8000 KDPH calculation are now live!", date: "2026-08-20", urgent: true }
          ],
          reports: []
        };
      });

      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
      const [showAdminLoginModal, setShowAdminLoginModal] = useState(false);
      const [adminPassInput, setAdminPassInput] = useState("");
      const [logoClickCount, setLogoClickCount] = useState(0);

      // 4. Passages State
      const [passages, setPassages] = useState(() => {
        const saved = localStorage.getItem("typeme_passages");
        return saved ? JSON.parse(saved) : INITIAL_PASSAGES;
      });
      const [selectedPassageId, setSelectedPassageId] = useState("1");
      const [customPassageText, setCustomPassageText] = useState("");
      const [customPassageTitle, setCustomPassageTitle] = useState("");
      const [showCustomModal, setShowCustomModal] = useState(false);

      // 5. Test Configuration
      const [examMode, setExamMode] = useState("SSC CGL");
      const [durationMinutes, setDurationMinutes] = useState(10);
      const [customMinutesInput, setCustomMinutesInput] = useState("10");
      const [testLanguage, setTestLanguage] = useState("English");
      const [testDifficulty, setTestDifficulty] = useState("Intermediate");
      const [testSettings, setTestSettings] = useState({
        punctuation: true,
        numbers: true,
        caps: true,
        backspace: true
      });
      const [fontSize, setFontSize] = useState(18);

      // 6. Active Test Execution
      const [isTesting, setIsTesting] = useState(false);
      const [showResultScreen, setShowResultScreen] = useState(false);
      const [userInputText, setUserInputText] = useState("");
      const [testStartTime, setTestStartTime] = useState(null);
      const [elapsedSeconds, setElapsedSeconds] = useState(0);
      const [backspaceCount, setBackspaceCount] = useState(0);
      const [mistypedKeysMap, setMistypedKeysMap] = useState({});
      const [lastTestSummary, setLastTestSummary] = useState(null);

      // 7. Cloud Google Drive & Sheet API
      const [googleAppUrl, setGoogleAppUrl] = useState(() => localStorage.getItem("typeme_google_url") || DEFAULT_GOOGLE_APP_URL);
      const [cloudStatus, setCloudStatus] = useState("connected");
      const [showCloudModal, setShowCloudModal] = useState(false);

      // 8. History & Leaderboard
      const [testHistory, setTestHistory] = useState(() => {
        const saved = localStorage.getItem("typeme_history");
        return saved ? JSON.parse(saved) : [];
      });
      const [leaderboardList, setLeaderboardList] = useState(INITIAL_LEADERBOARD);

      // 9. Feedback / Bug Report
      const [reportText, setReportText] = useState("");
      const [reportSubmittedToast, setReportSubmittedToast] = useState(false);

      // Refs
      const typingInputRef = useRef(null);
      const timerFrameRef = useRef(null);

      // Dark Mode Class synchronization
      useEffect(() => {
        if (darkMode) document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
        localStorage.setItem("typeme_theme", darkMode ? "dark" : "light");
      }, [darkMode]);

      // Persistence
      useEffect(() => { localStorage.setItem("typeme_user", JSON.stringify(user)); }, [user]);
      useEffect(() => { localStorage.setItem("typeme_history", JSON.stringify(testHistory)); }, [testHistory]);
      useEffect(() => { localStorage.setItem("typeme_passages", JSON.stringify(passages)); }, [passages]);
      useEffect(() => { localStorage.setItem("typeme_admin_cfg", JSON.stringify(adminState)); }, [adminState]);
      useEffect(() => { localStorage.setItem("typeme_google_url", googleAppUrl); }, [googleAppUrl]);

      // Active Passage Calculation
      const currentPassage = useMemo(() => {
        return passages.find(p => p.id === selectedPassageId) || passages[0] || INITIAL_PASSAGES[0];
      }, [selectedPassageId, passages]);

      // Filtered Passages
      const filteredPassages = useMemo(() => {
        return passages.filter(p => p.language === testLanguage && (testDifficulty === "Intermediate" || p.difficulty === testDifficulty));
      }, [passages, testLanguage, testDifficulty]);

      // Live metrics calculation
      const liveMetrics = useMemo(() => {
        const textTarget = currentPassage.text;
        let correctCount = 0;
        let wrongCount = 0;

        for (let i = 0; i < userInputText.length; i++) {
          if (userInputText[i] === textTarget[i]) {
            correctCount++;
          } else {
            wrongCount++;
          }
        }

        const totalCharsTyped = userInputText.length;
        const accuracyPercent = totalCharsTyped ? (correctCount / totalCharsTyped) * 100 : 100;
        const minutesElapsed = elapsedSeconds ? elapsedSeconds / 60 : 0.01;
        const grossWpm = minutesElapsed ? Math.round((totalCharsTyped / 5) / minutesElapsed) : 0;
        const netWpm = Math.max(0, grossWpm - Math.round(wrongCount / minutesElapsed));
        const cpm = minutesElapsed ? Math.round(totalCharsTyped / minutesElapsed) : 0;
        const kdph = minutesElapsed ? Math.round((totalCharsTyped / minutesElapsed) * 60) : 0;

        return {
          correctCount,
          wrongCount,
          errors: wrongCount,
          accuracyPercent,
          grossWpm,
          netWpm,
          cpm,
          kdph
        };
      }, [userInputText, currentPassage.text, elapsedSeconds]);

      // Keyboard shortcut for focus
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === "/" && !isTesting && e.target.tagName !== "INPUT" && e.target.tagName !== "TEXTAREA") {
            e.preventDefault();
            typingInputRef.current?.focus();
          }
          if (e.key === "Escape" && isTesting) {
            setIsTesting(false);
          }
        };
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [isTesting]);

      // Test Timer Loop
      useEffect(() => {
        if (!isTesting || !testStartTime) return;
        const onFrame = () => {
          const now = Date.now();
          const elapsed = Math.floor((now - testStartTime) / 1000);
          setElapsedSeconds(elapsed);
          if (elapsed >= durationMinutes * 60) {
            submitTest();
            return;
          }
          timerFrameRef.current = requestAnimationFrame(onFrame);
        };
        timerFrameRef.current = requestAnimationFrame(onFrame);
        return () => cancelAnimationFrame(timerFrameRef.current);
      }, [isTesting, testStartTime, durationMinutes]);

      const startTest = () => {
        setUserInputText("");
        setElapsedSeconds(0);
        setBackspaceCount(0);
        setMistypedKeysMap({});
        setShowResultScreen(false);
        setIsTesting(true);
        setTestStartTime(Date.now());
        setLastTestSummary(null);
        setTimeout(() => typingInputRef.current?.focus(), 60);
      };

      const submitTest = async () => {
        setIsTesting(false);
        if (soundEnabled) sound.playSubmitSuccess();

        // Check SSC qualification
        let sscStatus = "Needs Improvement (Practice More)";
        let sscQualified = false;
        if (liveMetrics.netWpm >= 35 && liveMetrics.accuracyPercent >= 95) {
          sscStatus = "SSC CGL / CHSL DEST Qualified (Speed ≥ 35 WPM, 95%+ Acc)";
          sscQualified = true;
        } else if (liveMetrics.netWpm >= 27 && liveMetrics.accuracyPercent >= 93) {
          sscStatus = "SSC CGL DEST Qualified (Speed ≥ 27 WPM)";
          sscQualified = true;
        }

        const summary = {
          id: Date.now().toString(),
          date: new Date().toLocaleDateString('en-GB'),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          userName: user.name || "Guest Aspirant",
          exam: examMode,
          language: testLanguage,
          wpm: liveMetrics.grossWpm,
          netWpm: liveMetrics.netWpm,
          cpm: liveMetrics.cpm,
          kdph: liveMetrics.kdph,
          accuracy: Number(liveMetrics.accuracyPercent.toFixed(1)),
          errors: liveMetrics.errors,
          duration: elapsedSeconds,
          passageTitle: currentPassage.title,
          keyErrors: { ...mistypedKeysMap },
          sscStatus,
          sscQualified
        };

        setLastTestSummary(summary);
        setShowResultScreen(true);
        setTestHistory(prev => [summary, ...prev].slice(0, 100));
        setTestStartTime(null);

        // Sync to Google Sheet
        if (googleAppUrl) {
          try {
            await fetch(googleAppUrl, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action: "saveTest", ...summary })
            });
          } catch (e) {}
        }
      };

      const handleTypingChange = (val) => {
        if (!isTesting) return;
        if (!testSettings.backspace && val.length < userInputText.length) return;

        if (val.length < userInputText.length) {
          setBackspaceCount(b => b + 1);
        }

        if (val.length > userInputText.length) {
          const typedChar = val[val.length - 1];
          const expectedChar = currentPassage.text[val.length - 1];
          const isMistake = typedChar !== expectedChar;

          if (soundEnabled) sound.playKeyClick(isMistake);

          if (isMistake) {
            const keyChar = expectedChar ? expectedChar.toLowerCase() : typedChar.toLowerCase();
            setMistypedKeysMap(prev => ({
              ...prev,
              [keyChar]: (prev[keyChar] || 0) + 1
            }));
          }
        }

        setUserInputText(val);
        if (val.length >= currentPassage.text.length) {
          submitTest();
        }
      };

      // Hidden Logo Click Trigger for Admin Panel
      const handleLogoClick = () => {
        const next = logoClickCount + 1;
        setLogoClickCount(next);
        if (next >= 1) {
          setShowAdminLoginModal(true);
          setLogoClickCount(0);
        }
      };

      // Admin Auth Verification
      const handleAdminLogin = () => {
        if (adminPassInput === "SaJahan0") {
          setIsAdminAuthenticated(true);
          setShowAdminLoginModal(false);
          setActiveTab("admin");
          setAdminPassInput("");
        } else {
          alert("Incorrect Admin Credentials. Access Denied.");
        }
      };

      // Custom Passage Submission
      const handleAddCustomPassage = () => {
        if (!customPassageTitle.trim() || !customPassageText.trim()) {
          alert("Please enter both passage title and paragraph text.");
          return;
        }
        const words = customPassageText.trim().split(/\s+/).length;
        const newP = {
          id: Date.now().toString(),
          title: customPassageTitle.trim(),
          exam: "Custom / User",
          language: testLanguage,
          difficulty: "Intermediate",
          words,
          text: customPassageText.trim()
        };
        setPassages(prev => [newP, ...prev]);
        setSelectedPassageId(newP.id);
        setShowCustomModal(false);
        setCustomPassageTitle("");
        setCustomPassageText("");
        alert("Custom paragraph added! You can now practice on it.");
      };

      // Time Remaining calculations
      const remainingSecs = Math.max(0, durationMinutes * 60 - elapsedSeconds);
      const minsDisplay = Math.floor(remainingSecs / 60);
      const secsDisplay = remainingSecs % 60;

                <span>Google Drive Folder: <b className="font-mono text-slate-600 dark:text-slate-300">16GJ4G5Y...2kB0</b></span>
                <button onClick={() => setShowAuthModal(true)} className="underline hover:text-indigo-500">Login / Profile</button>
                <button onClick={() => setActiveTab("rules")} className="underline hover:text-indigo-500">SSC Norms</button>
              </div>
            </div>
          </footer>

          {/* MODAL 1: ONBOARDING / LOGIN MODAL */}
          {showAuthModal && (
            <div className="fixed inset-0 z-50 grid place-items-center bg-black/60 backdrop-blur-sm p-4">
              <div className="w-full max-w-md rounded-3xl border border-slate-200 dark:border-slate-800 p-6 md:p-8 bg-white dark:bg-slate-900 shadow-2xl space-y-5">
                <div className="text-center space-y-1">
                  <div className="w-12 h-12 mx-auto rounded-2xl bg-indigo-600 text-white font-black text-2xl grid place-items-center shadow-lg">⚡</div>
                  <h3 className="font-black text-xl text-slate-900 dark:text-white pt-2">Welcome to Typeme</h3>
                  <p className="text-xs text-slate-500">Enter your details to track your typing progress & rank on the leaderboard.</p>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold text-slate-700 dark:text-slate-300">Candidate Name *</label>
                    <input
                      type="text"
                      placeholder="e.g. Aman Kumar"
                      value={authForm.name}
                      onChange={e => setAuthForm({ ...authForm, name: e.target.value })}
                      className="mt-1 w-full rounded-xl border border-slate-200 dark:border-slate-800 px-3 py-2.5 bg-slate-50 dark:bg-slate-950 font-medium"
                    />
                  </div>

                  <div>
                    <label className="font-semibold text-slate-700 dark:text-slate-300">Target Examination</label>
                    <select
                      value={authForm.exam}
                      onChange={e => setAuthForm({ ...authForm, exam: e.target.value })}
                      className="mt-1 w-full rounded-xl border border-slate-200 dark:border-slate-800 px-3 py-2.5 bg-slate-50 dark:bg-slate-950"
                    >
                      <option>SSC CGL 2026</option>
                      <option>SSC CHSL 2026</option>
                      <option>SSC MTS</option>
                      <option>Stenographer Grade C/D</option>
                      <option>DEO / High Court / Railway</option>
                    </select>
                  </div>

                  <div>
                    <label className="font-semibold text-slate-700 dark:text-slate-300">Email Address (Optional for Gmail Sync)</label>
                    <input
                      type="email"
                      placeholder="name@gmail.com"
                      value={authForm.email}
                      onChange={e => setAuthForm({ ...authForm, email: e.target.value })}
                      className="mt-1 w-full rounded-xl border border-slate-200 dark:border-slate-800 px-3 py-2.5 bg-slate-50 dark:bg-slate-950 font-mono"
                    />
                  </div>
                </div>

                <div className="space-y-2 pt-2">
                  <button
                    onClick={() => {
                      if (!authForm.name.trim()) return alert("Please enter your name.");
                      setUser({
                        ...user,
                        name: authForm.name.trim(),
                        email: authForm.email.trim(),
                        exam: authForm.exam,
                        onboarded: true,
                        isGuest: false
                      });
                      setShowAuthModal(false);
                    }}
                    className="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold text-xs shadow-lg hover:opacity-90"
                  >
                    Enter Typeme & Save Profile
                  </button>

                  <button
                    onClick={() => {
                      setUser({
                        ...user,
                        name: "Guest Aspirant",
                        isGuest: true,
                        onboarded: true
                      });
                      setShowAuthModal(false);
                    }}
                    className="w-full py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 text-xs font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200"
                  >
                    Continue as Guest (No Login)
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 2: HIDDEN ADMIN LOGIN */}
          {showAdminLoginModal && (
            <div className="fixed inset-0 z-50 grid place-items-center bg-black/60 backdrop-blur-sm p-4">
              <div className="w-full max-w-sm rounded-3xl border border-slate-200 dark:border-slate-800 p-6 bg-white dark:bg-slate-900 shadow-2xl space-y-4">
                <div className="font-bold text-base text-slate-900 dark:text-white">Admin Authentication</div>
                <p className="text-xs text-slate-500">Authorized personnel only (Sajahan Ali).</p>
                <input
                  type="password"
                  placeholder="Security Key..."
                  value={adminPassInput}
                  onChange={e => setAdminPassInput(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && handleAdminLogin()}
                  className="w-full rounded-xl border border-slate-200 dark:border-slate-800 px-3 py-2.5 text-xs bg-slate-50 dark:bg-slate-950 font-mono"
                  autoFocus
                />
                <div className="flex gap-2">
                  <button
                    onClick={handleAdminLogin}
                    className="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-xs shadow"
                  >
                    Unlock Portal
                  </button>
                  <button
                    onClick={() => { setShowAdminLoginModal(false); setAdminPassInput(""); }}
                    className="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 text-xs font-semibold"
                  >
                    Cancel
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 3: CUSTOM PARAGRAPH BUILDER */}
          {showCustomModal && (
            <div className="fixed inset-0 z-50 grid place-items-center bg-black/60 backdrop-blur-sm p-4">
              <div className="w-full max-w-lg rounded-3xl border border-slate-200 dark:border-slate-800 p-6 bg-white dark:bg-slate-900 shadow-2xl space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-base text-slate-900 dark:text-white">Add Custom Paragraph</h3>
                  <button onClick={() => setShowCustomModal(false)} className="text-slate-400">✕</button>
                </div>
                <input
                  type="text"
                  placeholder="Paragraph Title (e.g. General Knowledge 2026)"
                  value={customPassageTitle}
                  onChange={e => setCustomPassageTitle(e.target.value)}
                  className="w-full rounded-xl border border-slate-200 dark:border-slate-800 px-3 py-2 text-xs bg-slate-50 dark:bg-slate-950"
                />
                <textarea
                  rows="6"
                  placeholder="Paste or write your custom text here..."
                  value={customPassageText}
                  onChange={e => setCustomPassageText(e.target.value)}
                  className="w-full rounded-xl border border-slate-200 dark:border-slate-800 p-3 text-xs bg-slate-50 dark:bg-slate-950 font-mono"
                />
                <div className="flex gap-2">
                  <button
                    onClick={handleAddCustomPassage}
                    className="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-xs shadow"
                  >
                    + Save & Select Passage
                  </button>
                  <button
                    onClick={() => setShowCustomModal(false)}
                    className="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 text-xs font-semibold"
                  >
                    Cancel
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 4: GOOGLE DRIVE CLOUD SYNC CONFIGURATION */}
          {showCloudModal && (
            <div className="fixed inset-0 z-50 grid place-items-center bg-black/60 backdrop-blur-sm p-4">
              <div className="w-full max-w-lg rounded-3xl border border-slate-200 dark:border-slate-800 p-6 bg-white dark:bg-slate-900 shadow-2xl space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-base text-slate-900 dark:text-white">☁️ Google Drive & Sheet Database</h3>
                  <button onClick={() => setShowCloudModal(false)} className="text-slate-400">✕</button>
                </div>
                <div className="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-xs space-y-1">
                  <div className="font-semibold text-slate-700 dark:text-slate-300">Target Google Drive Folder ID:</div>
                  <div className="font-mono text-indigo-600 dark:text-indigo-400 break-all select-all font-bold">
                    {GOOGLE_DRIVE_FOLDER_ID}
                  </div>
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-700 dark:text-slate-300">Google Apps Script Web App API URL</label>
                  <input
                    type="url"
                    value={googleAppUrl}
                    onChange={e => setGoogleAppUrl(e.target.value)}
                    className="mt-1 w-full rounded-xl border border-slate-200 dark:border-slate-800 px-3 py-2 text-xs bg-slate-50 dark:bg-slate-950 font-mono"
                  />
                </div>
                <div className="flex justify-between items-center pt-2">
                  <span className="text-xs text-emerald-500 font-bold">✓ Connected to Google Apps Script</span>
                  <button
                    onClick={() => setShowCloudModal(false)}
                    className="px-4 py-2 rounded-xl bg-indigo-600 text-white font-bold text-xs shadow"
                  >
                    Save & Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
